<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rebecca’s Saves</title>
<meta name="description" content="Rebecca’s saved recipes, articles, memes, and notes, sorted like a cookbook.">
<meta name="theme-color" content="#F3EBDF">
<meta name="color-scheme" content="light">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Recipe Box">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<main class="page">
  <header class="top">
    <div class="brand">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><rect x="4" y="2" width="24" height="28" rx="5" fill="#C05A3A"/><path d="M16 10v12l-5-3.2L6 22V8.5A3.5 3.5 0 0 1 9.5 5H16Z" fill="#FBF6EE" opacity=".95"/><path d="M16 10v12l5-3.2 5 3.2V8.5A3.5 3.5 0 0 0 22.5 5H16Z" fill="#F3E9CC"/></svg>
      <div>
        <h1>Rebecca’s Saves</h1>
        <p class="sub">Sorted into types, like a cookbook with dividers.</p>
      </div>
    </div>
    <div class="count" id="count" aria-live="polite" aria-atomic="true">Saved things</div>
  </header>

  <form class="search" role="search" id="search-form">
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16.2 16.2 21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <input id="q" type="search" name="saves-search" placeholder="Search your saves…" aria-label="Search your saves" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
    <button type="button" class="search-clear" id="search-clear" hidden aria-label="Clear search">✕</button>
  </form>

  <div class="box view-recent" id="box-wrap">
    <nav class="folder-tabs" aria-label="Sections">
      <button type="button" class="folder-tab recent on" data-type="recent" aria-pressed="true">Recent</button>
      <button type="button" class="folder-tab recipe" data-type="recipe" aria-pressed="false">Recipes</button>
      <button type="button" class="folder-tab article" data-type="article" aria-pressed="false">Articles</button>
      <button type="button" class="folder-tab meme" data-type="meme" aria-pressed="false">Memes</button>
      <button type="button" class="folder-tab note" data-type="note" aria-pressed="false">Notes</button>
    </nav>
    <div class="box-inner" id="box">
      <p class="empty" id="status">Opening the box…</p>
    </div>
  </div>
</main>

<noscript>
  <p class="noscript">This recipe box needs JavaScript turned on.</p>
</noscript>
<script src="js/app.js"></script>
</body>
</html>
