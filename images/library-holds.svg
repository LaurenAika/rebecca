  </g>
  <!-- navy book -->
  <g transform="rotate(3 200 250)">
    <rect x="100" y="222" width="220" height="50" rx="4" fill="#3D5A6C"/>
    <rect x="100" y="222" width="16" height="50" fill="#2C4452"/>
    <rect x="128" y="236" width="70" height="7" rx="2" fill="#C5D4E0"/>
    <rect x="128" y="248" width="40" height="6" rx="2" fill="#C5D4E0" opacity=".7"/>
