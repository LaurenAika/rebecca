<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <rect width="400" height="400" fill="#E7DFD2"/>
  <circle cx="70" cy="70" r="80" fill="#F3EDE3"/>
  <ellipse cx="200" cy="348" rx="150" ry="22" fill="#D8CBB8"/>
  <!-- bottom book gold -->
  <g transform="rotate(-4 200 300)">
    <rect x="90" y="268" width="230" height="46" rx="4" fill="#C4A35A"/>
